<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reports — FoodSaver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
    {% include "_navbar.html" %}

    <div class="container py-4">
        <h3 class="mb-4">Reports &amp; Insights</h3>

        {% if total_items == 0 %}
            <p class="text-muted">No data yet. Add some food items first.</p>
        {% else %}
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title">Waste by Category</h6>
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title">Risk Distribution (Active Items)</h6>
                        <canvas id="riskChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="card-title">Item Status Breakdown</h6>
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        {% endif %}
    </div>

    <script>
        const categoryData = {{ category_counts | tojson }};
        const riskData = {{ risk_counts | tojson }};
        const statusData = {{ status_counts | tojson }};

        if (Object.keys(categoryData).length > 0) {
            new Chart(document.getElementById('categoryChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(categoryData),
                    datasets: [{
                        label: 'Items Wasted',
                        data: Object.values(categoryData),
                        backgroundColor: '#dc3545'
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        }

        new Chart(document.getElementById('riskChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(riskData),
                datasets: [{
                    data: Object.values(riskData),
                    backgroundColor: ['#198754', '#ffc107', '#dc3545']
                }]
            },
            options: { responsive: true }
        });

        new Chart(document.getElementById('statusChart'), {
            type: 'pie',
            data: {
                labels: Object.keys(statusData),
                datasets: [{
                    data: Object.values(statusData),
                    backgroundColor: ['#0d6efd', '#198754', '#6c757d']
                }]
            },
            options: { responsive: true }
        });
    </script>
</body>
</html>
